###################
### KEYBINDINGS ###
###################

###############################################################################
# CORE WINDOW MANAGER CONTROLS
###############################################################################

bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, J, layoutmsg, swapwithmaster
bind = $mainMod, H, exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/cliphist.rasi | cliphist decode | wl-copy
bind = $mainMod, L, exec, hyprlock >/dev/null 2>&1 &
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, P, layoutmsg, orientationnext
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, $HOME/.local/bin/kill-app
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, kitty --class kitty-float
bind = $mainMod, V, togglefloating
bind = SUPER SHIFT, TAB, exec, ~/.config/waybar/scripts/power-menu.sh


##############################################################################
# WIndow switch / Overview / Glance
##############################################################################
# Window overview (all windows, all workspaces)
bind = SUPER, TAB, exec, $windowMenu
bind = SUPER, SPACE, exec, $appsMenu

# Quick toggle between current and last focused window
# bind = SUPER, GRAVE, exec, hyprswitch simple --sort-recent

###############################################################################
# APP LAUNCHERS
###############################################################################

# ws1: Brave
bind = $mainMod, B, exec, brave --new-window

# ws2: Firefox
bind = $mainMod, X, exec, firefox --new-window

# ws3: Evolution (email)
bind = $mainMod, G, exec, evolution

# ws4: Cursor AI CDI
bind = $mainMod, grave, exec, cursor

# ws6: Notion (XWayland wrapper)
bind = $mainMod, N, exec, ~/.local/bin/notion-xwayland

# ws7: Discord (Gen-Chat)
bind = $mainMod, D, exec, discord

# ws8: Slack (snap)
bind = $mainMod, C, exec, slack

# Obsidian notes - uses system obsidian or AppImage if available
bind = $mainMod, O, exec, obsidian

# TUI network fallback
bind = $mainMod, K, exec, kitty -e nmtui

###############################################################################
# SCREENSHOTS
###############################################################################

# Screenshot directory
$screenshotDir = $HOME/Pictures/Screenshots

# Screenshot full screen - SUPER+A (All) - with notification preview
bind = SUPER, A, exec, sh -c 'DIR="$screenshotDir"; mkdir -p "$DIR"; FILE="$DIR/Screenshot_$(date +%Y-%m-%d_%H-%M-%S).png"; grim - | tee "$FILE" | wl-copy && (ACTION=$(notify-send -i "$FILE" -a "Screenshot" -A "open=Open" "Screenshot captured" "$FILE"); [ "$ACTION" = "open" ] && xdg-open "$FILE") &'

# Screenshot selection - SUPER+SHIFT+A (Area) - with notification preview
bind = SUPER+SHIFT, A, exec, sh -c 'DIR="$screenshotDir"; mkdir -p "$DIR"; FILE="$DIR/Screenshot_$(date +%Y-%m-%d_%H-%M-%S).png"; grim -g "$(slurp)" - | tee "$FILE" | wl-copy && (ACTION=$(notify-send -i "$FILE" -a "Screenshot" -A "open=Open" "Selection captured" "$FILE"); [ "$ACTION" = "open" ] && xdg-open "$FILE") &'

# Screenshot active window - SUPER+CTRL+A (Active) - with notification preview
bind = SUPER+CTRL, A, exec, sh -c 'DIR="$screenshotDir"; mkdir -p "$DIR"; FILE="$DIR/Window_$(date +%Y-%m-%d_%H-%M-%S).png"; grim -g "$(hyprctl activewindow -j | jq -r "\"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])\"")" - | tee "$FILE" | wl-copy && (ACTION=$(notify-send -i "$FILE" -a "Screenshot" -A "open=Open" "Window captured" "$FILE"); [ "$ACTION" = "open" ] && xdg-open "$FILE") &'

# Screen recording menu
bind = SUPER+SHIFT, R, exec, ~/.local/bin/screenrec-menu

# Screen Record stop (always works)
bind = SUPER+SHIFT, V, exec, pkill -INT wf-recorder



###############################################################################
# NETWORK / RESCUE
###############################################################################

# One-touch Wi-Fi rescue (needs polkit; will ask for password)
bind = $mainMod, W, exec, pkexec sh -c 'modprobe -r mwifiex_pcie mwifiex; modprobe mwifiex_pcie; systemctl restart NetworkManager'

###############################################################################
# FOCUS & NAVIGATION
###############################################################################

# Move focus with mainMod + arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Resize windows
bind = $mainMod SHIFT, left,  resizeactive, -50 0
bind = $mainMod SHIFT, right, resizeactive, 50 0
bind = $mainMod SHIFT, up,    resizeactive, 0 -50
bind = $mainMod SHIFT, down,  resizeactive, 0 50

# Move windows
bind = $mainMod CTRL, left,  movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up,    movewindow, u
bind = $mainMod CTRL, down,  movewindow, d

###############################################################################
# WORKSPACES
###############################################################################

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod CONTROL, S, togglespecialworkspace, magic_2
bind = $mainMod CONTROL SHIFT, S, movetoworkspace, special:magic_2

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

###############################################################################
# MOUSE BINDINGS
###############################################################################

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

###############################################################################
# MEDIA & BRIGHTNESS KEYS
###############################################################################

# Volume + mic mute
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Screen brightness
bindel = ,XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media controls (requires playerctl)
bindl = ,XF86AudioNext,  exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay,  exec, playerctl play-pause
bindl = ,XF86AudioPrev,  exec, playerctl previous
